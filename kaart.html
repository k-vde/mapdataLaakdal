<body>



<div id="map" style="width: 600px; height: 400px; position: relative;"> </div>
	
	<script>

	const map = L.map('map').setView([51.07544, 5.01445], 13);

	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a><br>icons: Icon: <a href="https://github.com/rapideditor/temaki">Temaki</a> (CC0)'
	}).addTo(map);
	
	const markers = L.markerClusterGroup({
  		disableClusteringAtZoom: 18   // ✅ clustering stops at zoom 18
	});


/ ✅ cache storage
const iconCache = {};

// ✅ factory with caching
function getLampIcon(color) {
  if (!iconCache[color]) {
    iconCache[color] = L.divIcon({
      className: "",
      html: `
        <svg viewBox="0 0 15 15" width="32" height="32">
          <path fill="${color}" d="M6 12L7 12C7.55 12 8 12.45 8 13L8 14L2 14L2 13C2 12.45 2.45 12 3 12L4 12L4 4C4 2.34 5.34 1 7 1L13 1L13 3C13 4.1 12.1 5 11 5L10 5C8.9 5 8 4.1 8 3L7.5 3C6.67 3 6 3.67 6 4.5L6 12ZM9 2L9 3C9 3.55 9.45 4 10 4L11 4C11.55 4 12 3.55 12 3L12 2L9 2L9 2Z"/>
        </svg>
      `,
      iconSize: [32, 32],
      iconAnchor: [16, 32]
    });
  }

  return iconCache[color];
}


L.marker([51.07544, 5.01445], {icon: lampIcon}).addTo(map);

fetch("verlichtingspalen.geojson")
  .then(response => response.json())
  .then(data => {
    const geoLayer = L.geoJSON(data, {
      // Optional styling for points
      pointToLayer: function (feature, latlng) {
        const color = "red";

        return L.marker(latlng, {
          icon: getLampIcon(color)  // ✅ reused if already created
        },

      // Optional: popup with properties
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          let popupContent = "";
          for (let key in feature.properties) {
            popupContent += `<strong>${key}</strong>: ${feature.properties[key]}<br>`;
          }
          layer.bindPopup(popupContent);
        }
      }
    });


    markers.addLayer(geoLayer);  // ✅ add to cluster
    map.addLayer(markers);       // ✅ add cluster to map

	  
  })
  .catch(err => console.error("Error loading GeoJSON:", err));
		





</script>





</body></html>
