<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Quick Start - Leaflet</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="file:///C:/Users/koenvde/Downloads/docs/images/favicon.ico">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>


	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	
<meta id="ConnectiveDocSignExtentionInstalled" name="ConnectiveDocSignExtentionInstalled" data-extension-version="1.0.5"></head>
<body>



<div id="map" style="width: 600px; height: 400px; position: relative;"> </div>
	
	<script>

	const map = L.map('map').setView([51.07544, 5.01445], 13);

	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> tekst tekst tekst'
	}).addTo(map);
	
	const markers = L.markerClusterGroup({
  		disableClusteringAtZoom: 18   // ✅ clustering stops at zoom 18
	});

	var lampIcon = L.icon({
  	  iconUrl: 'street_lamp_arm.svg',
		iconSize: [32, 32],
		iconAnchor: [16, 32]
	});

L.marker([51.07544, 5.01445], {icon: lampIcon}).addTo(map);

fetch("verlichtingspalen.geojson")
  .then(response => response.json())
  .then(data => {
    const geoLayer = L.geoJSON(data, {
      // Optional styling for points
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: lampIcon });
      },

      // Optional: popup with properties
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          let popupContent = "";
          for (let key in feature.properties) {
            popupContent += `<strong>${key}</strong>: ${feature.properties[key]}<br>`;
          }
          layer.bindPopup(popupContent);
        }
      }
    });


    markers.addLayer(geoLayer);  // ✅ add to cluster
    map.addLayer(markers);       // ✅ add cluster to map

	  
  })
  .catch(err => console.error("Error loading GeoJSON:", err));
		





</script>





</body></html>
